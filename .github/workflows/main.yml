      # 3. Deploy no OrderService (Instância 1)
      - name: Deploy no OrderService (Nó 1)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ORDER_IP_1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "sistema-distribuido-app-1.0.0.jar"
          target: "/home/${{ secrets.EC2_USER }}/app"

      - name: Reiniciar OrderService (Nó 1)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.ORDER_IP_1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
