name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Dispara automaticamente ao fazer push na branch main

jobs:
  # -------------------------------------------------------------
  # JOB 1: Compilação centralizada do Fat JAR
  # -------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e gerar Fat JAR
        run: mvn clean package -DskipTests

      - name: Armazenar artefato JAR gerado
        uses: actions/upload-artifact@v3
        with:
          name: app-jar
          path: target/sistema-distribuido-app-1.0.0.jar

  # -------------------------------------------------------------
  # JOB 2: Deploy automático nas instâncias AWS EC2
  # -------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o artefato compilado
        uses: actions/download-artifact@v3
        with:
          name: app-jar

      # 1. Deploy no API Gateway
      - name: Deploy no API Gateway
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.GATEWAY_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "sistema-distribuido-app-1.0.0.jar"
          target: "/home/${{ secrets.EC2_USER }}/app"

      - name: Reiniciar API Gateway
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.GATEWAY_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f "sistema-distribuido-app" || true
            sleep 2
            cd /home/${{ secrets.EC2_USER }}/app
            nohup java -jar sistema-distribuido-app-1.0.0.jar \
              --node=gateway \
              --tcp-port=8080 \
              --udp-port=9090 > gateway.log 2>&1 &
            echo "API Gateway atualizado e rodando!"

      # # 2. Deploy no TaxService (Instância 1)
